[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "ecommerce-scraping"
version = "0.1.0"
description = "Polite Scrapy ingestion pipeline for e-commerce product data: redacted raw pages, validated Parquet, DuckDB views"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Typing :: Typed"]
dependencies = [
  "scrapy>=2.14",
  "parsel>=1.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "duckdb>=1.1",
  "typer>=0.15",
]

[project.scripts]
ecommerce-scraping = "ecommerce_scraping.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2",
  "pytest-cov>=7",
  "coverage>=7.10",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
timeout = 60
markers = ["network: hits a live site (pytest -m network)"]

[tool.coverage.run]
source = ["ecommerce_scraping"]
patch = ["subprocess"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["BLE"]  # every broad except says why: `# noqa: BLE001 - reason`

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
