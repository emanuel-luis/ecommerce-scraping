# Weekly update PRs, one per ecosystem: the SHA-pinned actions, uv.lock and the Docker bases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      uv: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    ignore:
      # The runtime stays on Python 3.12 (refactor baseline); only patch and digest updates of that tag.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
