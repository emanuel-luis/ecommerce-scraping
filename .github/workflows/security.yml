name: security

# Supply-chain checks: known vulnerabilities in what uv.lock pins (pip-audit) and the workflows
# themselves (zizmor).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    name: pip-audit (known vulnerabilities in uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12" }
      # every package uv.lock pins, dev group included, with hashes: pip-audit resolves nothing
      - run: uv export --frozen --all-groups --no-emit-project -o "$RUNNER_TEMP/locked.txt"
      # Ignored: six Twisted 26.4.0 advisories, all in server code this project never runs (IMAP4
      # server, conch telnet, words XML stream, IRC server, HTTP server headers); Scrapy uses the
      # HTTP client and the telnet console is disabled. Remove when Twisted 26.10.0 is released
      # (docs/DECISIONS.md #17).
      - run: >-
          uvx pip-audit==2.10.1 --disable-pip --progress-spinner off -r "$RUNNER_TEMP/locked.txt"
          --ignore-vuln GHSA-8pqf-f4m5-798g
          --ignore-vuln GHSA-cwm5-jh59-mwxr
          --ignore-vuln GHSA-2qrf-pqgx-qh9v
          --ignore-vuln GHSA-3476-c5c2-fr73
          --ignore-vuln GHSA-53xc-49m8-p798
          --ignore-vuln GHSA-q7qq-6mhp-9rc4

  zizmor:
    name: zizmor (GitHub Actions workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12" }
      - name: Audit the workflows (fails on a finding of medium severity or higher)
        run: uvx zizmor==1.30.1 --format=github --min-severity=medium .github/workflows
        env:
          # the online audits: impostor commits, known-vulnerable actions, stale refs
          GH_TOKEN: ${{ github.token }}
